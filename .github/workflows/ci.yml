name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # @kwoncheulJin/error-snapshot (GitHub Packages) 설치
  packages: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            pdfium-library: aarch64-apple-darwin/libpdfium.dylib
            onnxruntime-library: aarch64-apple-darwin/libonnxruntime.dylib
          - os: windows-latest
            pdfium-library: x86_64-pc-windows-msvc/pdfium.dll
            onnxruntime-library: x86_64-pc-windows-msvc/onnxruntime.dll
          - os: ubuntu-22.04
            pdfium-library: x86_64-unknown-linux-gnu/libpdfium.so
            onnxruntime-library: x86_64-unknown-linux-gnu/libonnxruntime.so
    steps:
      - uses: actions/checkout@v4

      - name: Linux 시스템 의존성 (Tauri v2)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm

      # .npmrc의 @kwoncheulJin 스코프 레지스트리에 토큰을 붙인다(값은 환경변수로만 들어간다).
      - name: GitHub Packages 인증
        run: echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" >> "$HOME/.npmrc"

      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: pdfium 캐시
        uses: actions/cache@v4
        with:
          path: src-tauri/pdfium
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-pdfium.mjs') }}

      - run: pnpm fetch:pdfium

      # tauri-build는 cargo build·clippy·test 때도 번들 리소스(OCR 모델)와 macOS 프레임워크
      # (ONNX Runtime dylib)를 복사하므로 cargo 명령보다 먼저 받는다(계획서 §6.4 배포).
      # 러너의 OS·아키텍처에 맞는 타깃을 스크립트가 고른다.
      - name: OCR 런타임·모델 캐시
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/onnxruntime
            src-tauri/ocr-models
          key: ocr-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-ocr.mjs') }}

      - run: pnpm fetch:ocr

      # 고지의 pdfium 원문을 aarch64-apple-darwin 폴더에서 읽으므로 arm64 macOS 잡에서만 돈다(계획서 P4-5).
      - name: 라이선스 검사
        if: runner.os == 'macOS'
        run: pnpm licenses:check

      # Windows에서도 구분자가 맞는 절대 경로가 되도록 node로 푼다.
      - name: PDFIUM_LIB_PATH 설정
        run: |
          library_path=$(node -p "require('node:path').resolve('src-tauri/pdfium/${{ matrix.pdfium-library }}')")
          echo "PDFIUM_LIB_PATH=$library_path" >> "$GITHUB_ENV"

      # OCR 테스트(crates/pdf-core/tests/ocr.rs, compare_ocr.rs, compare_runner.rs의 스캔 쪽)는
      # 두 값이 있어야 돈다. 없으면 건너뛴다(docs/rules/testing.md).
      - name: OCR 테스트 경로 설정
        run: |
          library_path=$(node -p "require('node:path').resolve('src-tauri/onnxruntime/${{ matrix.onnxruntime-library }}')")
          model_dir=$(node -p "require('node:path').resolve('src-tauri/ocr-models')")
          echo "ONNXRUNTIME_LIB_PATH=$library_path" >> "$GITHUB_ENV"
          echo "OCR_MODEL_DIR=$model_dir" >> "$GITHUB_ENV"

      - run: pnpm validate

      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test

      - name: Playwright WebKit 설치
        if: runner.os == 'macOS'
        run: pnpm exec playwright install webkit

      - name: E2E
        if: runner.os == 'macOS'
        run: pnpm test:e2e

      - name: E2E 실패 기록 업로드
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore

      # pdfium.dll·onnxruntime.dll을 설치 폴더(resource_dir)에 넣는다. 앱은 거기서 pdfium을 바인딩하고
      # OCR 엔진을 로드한다(src-tauri/src/pdf_engine.rs, compare.rs). OCR 모델은 tauri.conf.json이 넣는다.
      # JSON을 인자로 넘기면 Windows 셸 인용에 깨지므로 파일로 넘긴다.
      - name: Windows NSIS 설치 파일 빌드
        if: runner.os == 'Windows'
        run: |
          echo '{"bundle":{"resources":{"pdfium/x86_64-pc-windows-msvc/pdfium.dll":"pdfium.dll","onnxruntime/x86_64-pc-windows-msvc/onnxruntime.dll":"onnxruntime.dll"}}}' > target/windows-bundle.conf.json
          pnpm tauri build --config target/windows-bundle.conf.json

      - name: NSIS 설치 파일 업로드
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: pdf-studio-windows-nsis
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
