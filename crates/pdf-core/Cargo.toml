[package]
name = "pdf-core"
version = "0.1.0"
edition = "2024"

[dependencies]
image = { version = "0.25", default-features = false }
imageproc = { version = "0.27.0", default-features = false }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic"] }
pdfium-render = { version = "0.9.4", default-features = false, features = ["thread_safe", "pdfium_7881"] }
thiserror = "2.0.21"
tiff = "0.11.3"

[dev-dependencies]
unicode-normalization = "0.1.25"
