[package]
name = "pdf-core"
version = "0.1.0"
edition = "2024"

[dependencies]
image = { version = "0.25", default-features = false }
imageproc = { version = "0.27.0", default-features = false }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic"] }
pdfium-render = { version = "0.9.4", default-features = false, features = ["thread_safe", "pdfium_7881"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
similar = { version = "3.2.0", default-features = false, features = ["std"] }
thiserror = "2.0.21"
tiff = "0.11.3"
unicode-normalization = "0.1.25"
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
