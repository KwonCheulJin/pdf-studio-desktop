[package]
name = "pdf-core"
version = "0.1.0"
edition = "2024"

[dependencies]
pdfium-render = { version = "0.9.4", default-features = false, features = ["thread_safe", "pdfium_7881"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tiff = "0.11.3"
unicode-normalization = "0.1.25"

[dev-dependencies]
serde_json = "1.0.154"
