[package]
name = "translate"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23"
log = "0.4.34"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
tokio = { version = "1.53.2", features = ["time"] }
unicode-normalization = "0.1.25"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt", "test-util", "net", "io-util"] }
